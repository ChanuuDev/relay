<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Relay · 세션 기록</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/" data-nav>relay<span>SESSION CONTINUITY</span></a><span class="local-tag">LOCAL ONLY · 읽기 전용</span></header>
  <main>
    <div class="heading"><div><p class="eyebrow">YOUR WORK, CONNECTED</p><h1 id="page-title">세션 기록</h1><p class="subtitle">Agent가 남긴 기록을 확인하고, 다음 작업으로 이어가세요.</p></div><button id="refresh" type="button">새로고침</button></div>
    <div class="connection"><span id="connection-state" role="status">연결 확인 중…</span><span id="last-success">마지막 조회 —</span></div>
    <p id="database-path" class="database">저장소 확인 중…</p>
    <div id="global-error" class="notice error" role="alert" hidden></div>
    <section id="list-view">
      <form id="filters" class="filters">
        <label class="search">검색<input name="q" placeholder="세션 이름, ID, 요약, 작업 경로" maxlength="4000"></label>
        <label>상태<select name="status"><option value="">전체 상태</option>ACTIVE</option><option>INTERRUPTED</option><option>COMPLETED</option><option>ABANDONED</option></select></label>
        <label>Provider<input name="provider" placeholder="전체 · openai 등" list="providers" maxlength="64"></label>
        <datalist id="providers"><option value="openai"><option value="anthropic"><option value="xai"></datalist>
        <label>Agent<input name="agent" placeholder="전체 · codex 등" maxlength="64"></label>
        <label class="path-filter">프로젝트 경로<input name="cwd" placeholder="전체 프로젝트 · 절대경로로 검색"></label>
        <label>표시 개수<select name="limit"><option value="20">20개</option><option value="50" selected>50개</option><option value="100">100개</option></select></label>
        <div class="filter-actions"><button class="primary" type="submit">검색</button><button id="reset" type="button">초기화</button></div>
      </form>
      <p class="hint">ACTIVE는 마지막으로 기록한 상태이며, Agent의 현재 실행 여부가 아닙니다.</p>
      <div id="list-error" class="notice error" role="alert" hidden></div>
      <div id="list-content" aria-live="polite"><p class="empty">세션 불러오는 중…</p></div>
    </section>
    <section id="detail-view" hidden>
      <a id="back-link" href="/" data-nav class="back">← 목록으로 돌아가기</a>
      <div id="detail-error" class="notice error" role="alert" hidden></div>
      <div id="detail-content"><p class="empty">상세 불러오는 중…</p></div>
      <div class="panel"><h2>이어받은 세션</h2><div id="children-error" class="notice error" role="alert" hidden></div><div id="children-content"></div></div>
      <div class="panel"><h2>진행 이력</h2><div id="updates-error" class="notice error" role="alert" hidden></div><div id="updates-content"></div></div>
    </section>
    <div id="copy-fallback" class="panel" hidden><label>자동 복사 실패 — 아래 원문을 선택하여 복사하세요.<textarea readonly id="copy-text"></textarea></label></div>
    <p id="copy-status" class="copy-status" role="status"></p>
    <footer>로컬 SQLite에 저장된 최소 세션 인덱스 · 전체 대화는 저장하지 않습니다.</footer>
  </main>
</body>
</html>
