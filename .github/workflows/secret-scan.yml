# 훅을 건너뛴 커밋(--no-verify, 다른 PC)도 잡는다. 결과에는 위치와 규칙 이름만 나온다.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/secret-scan.mjs --all
