# 원격 서버 배포: server·packages/core·deploy가 바뀐 main 푸시마다
#   1) 서버 테스트 → 2) 이미지를 GHCR(비공개)에 push → 3) SSH로 compose·nginx 설정을 올리고 pull·up → 4) health 확인.
# 비밀은 Secrets에만 둔다: DEPLOY_HOST(SSH 호스트명), DEPLOY_USER, DEPLOY_KEY(pem 내용).
# 서버의 GHCR 로그인은 이 실행의 GITHUB_TOKEN으로 그때만 한다(서버에 장기 토큰을 두지 않는다).
name: deploy-server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "packages/core/**"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/relay-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/bun/install.js
      - run: npm run build -w @relay/core
      - run: npm run build:web
      - run: npm run check -w @relay/server

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/relay-api" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          build-args: RELAY_BUILD=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: compose·nginx 설정·배포 스크립트 올리기
        run: |
          scp -i ~/.ssh/deploy_key deploy/compose.yml deploy/backup.sh deploy/deploy-remote.sh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/relay/"
          scp -i ~/.ssh/deploy_key deploy/nginx/conf.d/00-limits.conf deploy/nginx/conf.d/default.conf "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/relay/nginx/conf.d/"
          scp -i ~/.ssh/deploy_key deploy/nginx/relay.conf "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/relay/nginx/relay.conf.new"
      - name: 이미지 받아 다시 띄우기
        # 스크립트는 파일로 두고 stdin으로는 토큰 한 줄만 보낸다(docker 명령이 stdin을 삼키지 않게).
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          tag="${{ needs.build.outputs.tag }}"
          printf '%s\n' "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            bash /srv/relay/deploy-remote.sh "ghcr.io/${owner}/relay-api:${tag}" "${{ github.actor }}"
      - name: 바깥에서 health 확인
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 https://relay.chanuu.com/api/v1/health | grep -q '"kind":"relay-remote"'; then echo ok; exit 0; fi
            sleep 3
          done
          echo "https health failed (인증서 발급 전이면 무시)"; exit 0
