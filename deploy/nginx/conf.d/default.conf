# 모르는 호스트(IP 직접 접속, server.chanuu.com 등)는 응답 없이 끊는다. 443은 인증서 없이 핸드셰이크를 거부한다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
