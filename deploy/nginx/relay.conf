# 2단계(인증서 발급 뒤): __RELAY_DOMAIN__ → relay-api. 80은 ACME와 443 리다이렉트만.
server {
    listen 80;
    listen [::]:80;
    server_name __RELAY_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __RELAY_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__RELAY_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__RELAY_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:relay_ssl:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64m;
    limit_req zone=relay burst=40 nodelay;

    # 상류 주소는 요청 때 docker DNS로 푼다. relay-api 컨테이너가 아직 없어도 nginx는 뜨고, 그때는 502를 낸다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $relay_api http://relay-api:3000;

    # 파일 올리기만 더 큰 본문을 받고, 버퍼에 담지 않고 그대로 넘긴다.
    location = /api/v1/files/content {
        client_max_body_size 256m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass $relay_api;
    }

    # PC 파일 중계(server/src/pcs): PC의 relay.exe가 요청을 기다리고(최대 30초) 응답 바이트를 본문으로 흘려보낸다.
    # 파일 크기를 미리 알 수 없으므로 본문 크기 제한을 두지 않고, 버퍼 없이 바로 넘긴다. 인증은 relay-api가 한다.
    location ^~ /api/v1/agent/ {
        limit_req zone=relay_pc burst=200 nodelay;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass $relay_api;
    }

    # 브라우저가 받는 PC 파일. PC에서 오는 흐름을 버퍼에 모으지 않고 그대로 넘긴다.
    location ^~ /api/v1/pcs/ {
        limit_req zone=relay_pc burst=200 nodelay;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass $relay_api;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_pass $relay_api;
    }
}
