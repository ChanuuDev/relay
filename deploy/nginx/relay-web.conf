# 브라우저 모드 화면(2단계, 인증서 발급 뒤): __RELAY_WEB_DOMAIN__ → 정적 화면(/srv/relay-web/current) + /api/는 relay-api.
# 화면은 scripts/export-web.ts가 만든 폴더이고, 토큰은 브라우저가 Authorization 헤더로 붙인다(쿠키 없음).
# nginx는 location에 add_header가 하나라도 있으면 바깥 것을 물려받지 않으므로, 보안 헤더를 location마다 적는다.
server {
    listen 80;
    listen [::]:80;
    server_name __RELAY_WEB_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __RELAY_WEB_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__RELAY_WEB_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__RELAY_WEB_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:relay_ssl:10m;
    ssl_session_tickets off;

    # 요청 제한은 API에만 건다. 첫 화면은 자산 40여 개와 서비스 워커의 사전 보관을 한꺼번에 받으므로 정적 파일에는 걸지 않는다.
    client_max_body_size 64m;
    root /srv/relay-web/current;
    charset utf-8;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $relay_api http://relay-api:3000;

    # 파일 올리기만 더 큰 본문을 받고 버퍼 없이 넘긴다. 내려받는 파일 내용은 이 출처에서 아무것도 실행하지 못하게 격리한다.
    location = /api/v1/files/content {
        # 폴더를 열면 미리 보기 그림을 한꺼번에 받으므로 여유를 더 둔다.
        limit_req zone=relay burst=80 nodelay;
        client_max_body_size 256m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass $relay_api;
    }

    # PC 파일 중계(server/src/pcs): PC의 relay.exe가 요청을 기다리고(최대 30초) 응답 바이트를 본문으로 흘려보낸다.
    # 파일 크기를 미리 알 수 없으므로 본문 크기 제한을 두지 않고, 버퍼 없이 바로 넘긴다. 인증은 relay-api가 한다.
    location ^~ /api/v1/agent/ {
        limit_req zone=relay_pc burst=200 nodelay;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass $relay_api;
    }

    # 브라우저가 받는 PC 파일. PC에서 오는 흐름을 버퍼에 모으지 않고 그대로 넘긴다.
    location ^~ /api/v1/pcs/ {
        limit_req zone=relay_pc burst=200 nodelay;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass $relay_api;
    }

    # ^~: 그림 확장자 정규식 location보다 먼저 잡아 API는 늘 relay-api로 간다.
    location ^~ /api/ {
        limit_req zone=relay burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass $relay_api;
    }

    # 서비스 워커는 늘 새로 확인해야 화면 갱신이 바로 퍼진다.
    location = /sw-web.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # nginx 기본 MIME 표에 없는 두 형식. PDF 미리 보기 워커는 모듈 스크립트라 자바스크립트 형식이어야 열린다.
    location = /pdf.worker.mjs {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 메모의 Mermaid 다이어그램을 그리는 숨은 틀. 로컬 서버의 diagramHeaders와 같다.
    location = /mermaid-frame.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 그림·글꼴은 하루 보관한다.
    location ~* \.(?:png|jpe?g|webp|svg|woff2)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # 목록(/)과 세션 상세(/sessions/<id>)는 같은 화면이다. 그 밖의 없는 주소는 404.
    location ~ ^/(?:sessions/[^/]+)?$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: https:; script-src 'self'; style-src 'self'; connect-src 'self' https:; frame-src 'self' https://www.youtube-nocookie.com; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: https:; script-src 'self'; style-src 'self'; connect-src 'self' https:; frame-src 'self' https://www.youtube-nocookie.com; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }
}
