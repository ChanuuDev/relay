# 1단계(인증서 발급 전): ACME 챌린지만 받는다. provision.sh가 conf.d/relay.conf로 복사해 쓰고, 발급 뒤 relay.conf(2단계)로 바꾼다.
server {
    listen 80;
    listen [::]:80;
    server_name __RELAY_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 503;
    }
}
