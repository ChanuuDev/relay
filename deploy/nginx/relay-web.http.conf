# 브라우저 모드 화면 1단계(인증서 발급 전): ACME 챌린지만 받는다. deploy-remote.sh가 conf.d/relay-web.conf로 두고 인증서를 받은 뒤 relay-web.conf(2단계)로 바꾼다.
server {
    listen 80;
    listen [::]:80;
    server_name __RELAY_WEB_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 503;
    }
}
